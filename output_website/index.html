<script>
    // --- 1. SPA ROUTING LOGIC ---
    function navigateTo(pageId) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.getElementById(pageId + '-view').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchDashboardTab(tab) {
        const btnNormie = document.getElementById('tab-normie');
        const btnExpert = document.getElementById('tab-expert');
        const contentNormie = document.getElementById('content-normie');
        const contentExpert = document.getElementById('content-expert');

        if (tab === 'normie') {
            btnNormie.className = "px-8 py-2.5 rounded-full font-bold text-sm bg-white shadow-sm text-slate-900 transition";
            btnExpert.className = "px-8 py-2.5 rounded-full font-bold text-sm text-slate-500 hover:text-slate-900 transition";
            contentNormie.style.display = 'block';
            contentExpert.style.display = 'none';
        } else {
            btnExpert.className = "px-8 py-2.5 rounded-full font-bold text-sm bg-white shadow-sm text-slate-900 transition";
            btnNormie.className = "px-8 py-2.5 rounded-full font-bold text-sm text-slate-500 hover:text-slate-900 transition";
            contentExpert.style.display = 'block';
            contentNormie.style.display = 'none';
        }
    }

    // --- 2. CRYPTOGRAPHIC ENGINE ---
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function decodeQrPayload(rawValue) {
        if (!rawValue) {
            throw new Error("No QR payload was provided in the URL.");
        }

        let value = String(rawValue).trim();

        // If a full URL was accidentally passed, extract the d= parameter.
        if (value.startsWith("http://") || value.startsWith("https://")) {
            try {
                const parsed = new URL(value);
                value = parsed.searchParams.get("d") || value;
            } catch (err) {
                // fall through
            }
        }

        value = value.replace(/\s+/g, "");

        // Convert URL-safe Base64 to standard Base64
        value = value.replace(/-/g, "+").replace(/_/g, "/");

        // Add missing padding
        const remainder = value.length % 4;
        if (remainder) {
            value += "=".repeat(4 - remainder);
        }

        // Basic validation
        if (!/^[A-Za-z0-9+/=_-]+$/.test(value)) {
            throw new Error("The QR payload contains invalid characters.");
        }

        try {
            return Uint8Array.from(atob(value), ch => ch.charCodeAt(0));
        } catch (err) {
            throw new Error("Invalid QR payload encoding. The QR data could not be decoded.");
        }
    }

    async function initZeroTrustEngine() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('d');

        if (!encodedData) {
            navigateTo('home');
            return;
        }

        navigateTo('loading');

        try {
            const compressedBytes = decodeQrPayload(encodedData);

            // Python uses zlib.compress() => browser needs zlib inflate
            const inflatedBytes = pako.inflate(compressedBytes);

            const jsonString = new TextDecoder().decode(inflatedBytes);
            const packageObj = JSON.parse(jsonString);

            if (!packageObj || typeof packageObj !== 'object' || !packageObj.p || !packageObj.s) {
                throw new Error("Invalid QR package format.");
            }

            const payloadStr = packageObj.p;
            const providedSignature = packageObj.s;

            const calculatedSignature = await sha256(payloadStr);

            if (calculatedSignature !== providedSignature) {
                throw new Error("Hardware signature mismatch. Payload has been tampered with.");
            }

            const payload = JSON.parse(payloadStr);

            renderDashboard(payload);
            renderExpertGrid(payload);
            navigateTo('dashboard');

        } catch (error) {
            document.getElementById('loading-error-container').classList.remove('hidden');
            document.getElementById('loading-error-text').innerText = error.message;
            console.error(error);
        }
    }

    // --- 3. TRUST ALGORITHM & NORMIE UI ---
    // Compact key reference: ab=abuse, c=cpu, g=gpu, r=ram, b=board, st=storage, bt=battery
    function renderDashboard(data) {
        const abuse = data.ab || {};
        const thermal = abuse.t || 0;
        const whea = abuse.f || 0;
        const badBlocks = abuse.d || 0;
        const totalCrashes = (abuse.p || 0) + (abuse.u || 0) + (abuse.b || 0);

        let score = 100;
        let isCritical = false;
        let criticalMsg = "";

        // Instant-fail conditions
        if (thermal > 0) { score = 0; isCritical = true; criticalMsg = `Cooling System Failure: ${thermal} thermal throttling events logged.`; }
        if (whea > 0) { score = 0; isCritical = true; criticalMsg = "Fatal Silicon Architecture Errors (WHEA) detected."; }
        if (badBlocks > 0) { isCritical = true; criticalMsg = `Storage Degradation: ${badBlocks} Bad Disk Blocks. Drive failing.`; }

        // Graduated penalties
        score -= (badBlocks * 0.5);
        score -= (totalCrashes * 0.5);
        score = Math.max(0, Math.min(100, Math.floor(score)));

        const elScore = document.getElementById('ui-score');
        const elAdvice = document.getElementById('ui-advice');
        const headerBar = document.getElementById('score-header-bar');

        elScore.innerText = score;
        elScore.className = "text-9xl font-black mb-4 tracking-tighter";

        if (score >= 80) {
            elScore.classList.add('text-appleGreen');
            headerBar.className = "absolute top-0 left-0 w-full h-2 bg-appleGreen";
            elAdvice.innerText = "Condition Excellent. Safe to purchase.";
        } else if (score >= 50) {
            elScore.classList.add('text-appleOrange');
            headerBar.className = "absolute top-0 left-0 w-full h-2 bg-appleOrange";
            elAdvice.innerText = "Moderate Wear. Verify physical condition.";
        } else {
            elScore.classList.add('text-appleRed');
            headerBar.className = "absolute top-0 left-0 w-full h-2 bg-appleRed";
            elAdvice.innerText = "CRITICAL DANGER. Do not purchase.";
        }

        if (isCritical) {
            document.getElementById('ui-warning-banner').classList.remove('hidden');
            document.getElementById('ui-warning-text').innerText = criticalMsg;
        }

        // Populate hardware specs
        const cpu = data.c || {};
        document.getElementById('ui-cpu').innerText = cpu.n ? `${cpu.n} (${cpu.cl} GHz)` : "Unknown CPU";
        document.getElementById('ui-gpu').innerText = (data.g && data.g.length > 0) ? `${data.g[0].m} (${data.g[0].vr} GB)` : "Unknown GPU";
        document.getElementById('ui-ram').innerText = data.r ? `${data.r.toFixed(2)} GB` : "Unknown RAM";
        document.getElementById('ui-board').innerText = data.b ? `${data.b.mfg} ${data.b.m}` : "Unknown Board";

        // Timestamp
        if (data.t) {
            document.getElementById('ui-timestamp-container').classList.remove('hidden');
            const scanDate = new Date(data.t * 1000);
            document.getElementById('ui-timestamp').innerText = `Scan Generated: ${scanDate.toLocaleString()}`;
        }

        // Battery
        const bat = data.bt || {};
        let batStr = "Desktop PC";
        if (bat.st === "N/A") { batStr = "Desktop PC (No Battery)"; }
        else if (bat.h) {
            batStr = `${bat.h.toFixed(2)}% Health (${(bat.w || 0).toFixed(2)}% Wear)`;
        } else if (bat.st) {
            batStr = bat.st;
        }
        document.getElementById('ui-battery').innerText = batStr;

        // Storage
        let storageStr = "Unknown Storage";
        if (data.st && data.st.length > 0 && data.st[0].m) {
            storageStr = data.st[0].m;
        }
        document.getElementById('ui-storage').innerText = storageStr;

        // Stability counters
        document.getElementById('ui-crashes').innerText = totalCrashes;
        document.getElementById('ui-blocks').innerText = badBlocks;
        document.getElementById('ui-thermal').innerText = thermal;
    }

    // --- 4. ADVANCED FORENSICS ENGINE (Expert View) ---
    const KEY_MAP = {
        c:  { _title: "Processor Details",      n: "Name", co: "Cores", th: "Threads", cl: "Max Clock (GHz)" },
        g:  { _title: "Graphics (GPU)",         m: "Model", vr: "VRAM (GB)" },
        b:  { _title: "Motherboard",            mfg: "Manufacturer", m: "Product Model", s: "Serial Number" },
        st: { _title: "Storage (S.M.A.R.T.)",   m: "Model", sz: "Size (GB)", h: "Health Status", w: "Wear Level (%)", nw: "Warning" },
        bt: { _title: "Battery",                st: "Status", h: "Health (%)", w: "Wear Level (%)" },
        n:  { _title: "Network Adapters",       ma: "MAC Address", sp: "MAC Spoofed" },
        ab: { _title: "Abuse History",          p: "Critical Power Failures", u: "Unexpected Shutdowns", b: "Blue Screens of Death", d: "Bad Disk Blocks", t: "Thermal Throttling Events", f: "Fatal Hardware Errors" },
        sy: { _title: "System Flags",           w: "Warning" },
    };

    const CATEGORY_ORDER = ["c", "g", "b", "st", "bt", "ab", "n", "sy"];

    function renderExpertGrid(data) {
        const container = document.getElementById('expert-data-grid');
        container.innerHTML = '';

        for (const key of CATEGORY_ORDER) {
            if (!data[key]) continue;
            const labels = KEY_MAP[key] || {};

            const section = document.createElement('div');
            section.className = "mb-6 border border-slate-200 rounded-xl overflow-hidden";

            const header = document.createElement('div');
            header.className = "bg-slate-50 px-6 py-3 border-b border-slate-200 font-bold text-slate-700 text-sm tracking-wide uppercase";
            header.innerText = labels._title || key;
            section.appendChild(header);

            const tableContainer = document.createElement('div');
            tableContainer.className = "expert-table-container overflow-x-auto bg-white";

            if (Array.isArray(data[key])) {
                data[key].forEach((item, index) => {
                    tableContainer.appendChild(createDataGrid(item, data[key].length > 1 ? `#${index + 1}` : null, labels));
                });
            } else if (typeof data[key] === 'object') {
                tableContainer.appendChild(createDataGrid(data[key], null, labels));
            } else {
                const wrapper = document.createElement('div');
                wrapper.className = "px-6 py-4";
                const p = document.createElement('p');
                p.className = "text-sm font-medium text-slate-800";
                p.textContent = data[key];
                wrapper.appendChild(p);
                tableContainer.appendChild(wrapper);
            }

            section.appendChild(tableContainer);
            container.appendChild(section);
        }

        if (data.r) {
            const section = document.createElement('div');
            section.className = "mb-6 border border-slate-200 rounded-xl overflow-hidden";
            const header = document.createElement('div');
            header.className = "bg-slate-50 px-6 py-3 border-b border-slate-200 font-bold text-slate-700 text-sm tracking-wide uppercase";
            header.innerText = "Memory (RAM)";
            section.appendChild(header);

            const wrapper = document.createElement('div');
            wrapper.className = "px-6 py-4";
            const p = document.createElement('p');
            p.className = "text-sm font-medium text-slate-800";
            p.textContent = `Total Installed: ${data.r.toFixed(2)} GB`;
            wrapper.appendChild(p);
            section.appendChild(wrapper);

            container.appendChild(section);
        }
    }

    function createDataGrid(obj, subtitle, labels) {
        labels = labels || {};
        const wrapper = document.createElement('div');
        wrapper.className = "px-6 py-4";

        if (subtitle) {
            const sub = document.createElement('p');
            sub.className = "text-xs font-bold text-blue-500 mb-3 uppercase";
            sub.innerText = `Device ${subtitle}`;
            wrapper.appendChild(sub);
        }

        const grid = document.createElement('dl');
        grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-4";

        for (const [k, v] of Object.entries(obj)) {
            if (k === '_title') continue;
            if (typeof v === 'object' && v !== null) continue;

            let displayValue = v;

            if (k === 'h' && labels._title && labels._title.includes('Storage')) {
                const healthMap = { 'H': 'Healthy', 'W': 'Warning', 'U': 'Unhealthy' };
                displayValue = healthMap[v] || 'Unknown';
            } else if (k === 'sp') {
                displayValue = (v === 1) ? 'Yes (CRITICAL)' : 'No';
            } else if (k === 'nw' && labels._title && labels._title.includes('Storage')) {
                displayValue = (v === 'C') ? 'CRITICAL: Mechanical Drive' : v;
            } else if (k === 'w' && labels._title && labels._title.includes('System')) {
                displayValue = (v === 'S') ? 'SUSPICIOUS: Recent Reboot' : v;
            }

            const div = document.createElement('div');
            div.className = "flex flex-col border-b border-slate-100 pb-2";

            const dt = document.createElement('dt');
            dt.className = "text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1";
            dt.textContent = labels[k] || k.replace(/_/g, ' ');

            const dd = document.createElement('dd');
            dd.className = "text-sm font-medium text-slate-800 break-words";
            dd.textContent = displayValue;

            div.appendChild(dt);
            div.appendChild(dd);
            grid.appendChild(div);
        }

        wrapper.appendChild(grid);
        return wrapper;
    }

    window.onload = initZeroTrustEngine;
</script>
